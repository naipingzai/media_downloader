[project]
name = "media-downloader"
version = "1.0.0"
description = "多平台媒体下载工具 — 抖音、快手、小红书、B站"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "curl-cffi>=0.16.3",
    "lxml>=6.1.3",
    "pyperclip>=1.11.0",
    "PySide6>=6.6",
    "qrcode[pil]>=7.4",
    "Pillow>=10.0",
]

[project.scripts]
media-downloader = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
