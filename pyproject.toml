[project]
name = "media-downloader"
version = "1.0.0b1"
description = "支持抖音/TikTok、快手、小红书的统一媒体下载工具，提供 TUI/GUI/Web 三种界面。"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "click>=8.5.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
gui = ["pywebview>=6.2.1"]
all = [
    "pywebview>=6.2.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
media-downloader = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
