name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          mkdir -p build
          cd build
          curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg.tar.xz
          find . -name 'ffmpeg' -type f -executable -exec cp {} ./ffmpeg \;
          chmod +x ./ffmpeg
          ./ffmpeg -version | head -1

      - name: Build executable
        run: >
          pyinstaller
          --name MediaDownloader
          --onefile
          --windowed
          --noconfirm
          --clean
          --add-data "build/ffmpeg:."
          --add-data "ui/gui/resources/styles.qss:ui/gui/resources"
          --hidden-import curl_cffi
          --hidden-import curl_cffi._curl_cffi
          --hidden-import PySide6
          --hidden-import PySide6.QtWidgets
          --hidden-import PySide6.QtCore
          --hidden-import PySide6.QtGui
          --hidden-import qrcode
          --hidden-import PIL
          --hidden-import PIL.Image
          main.py

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-linux-${{ steps.version.outputs.version }}
          path: dist/MediaDownloader
          compression-level: 0

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        shell: cmd
        run: |
          mkdir build
          cd build
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          7z x ffmpeg.zip
          for /r %%f in (ffmpeg.exe) do copy "%%f" ffmpeg.exe
          ffmpeg.exe -version

      - name: Build executable
        shell: cmd
        run: >
          pyinstaller
          --name MediaDownloader
          --onefile
          --windowed
          --noconfirm
          --clean
          --add-data "build/ffmpeg.exe;."
          --add-data "ui/gui/resources/styles.qss;ui/gui/resources"
          --hidden-import curl_cffi
          --hidden-import curl_cffi._curl_cffi
          --hidden-import PySide6
          --hidden-import PySide6.QtWidgets
          --hidden-import PySide6.QtCore
          --hidden-import PySide6.QtGui
          --hidden-import qrcode
          --hidden-import PIL
          --hidden-import PIL.Image
          main.py

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-windows-${{ steps.version.outputs.version }}
          path: dist/MediaDownloader.exe
          compression-level: 0

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MediaDownloader ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/MediaDownloader
            artifacts/MediaDownloader.exe
          body: |
            ## MediaDownloader ${{ steps.version.outputs.version }}

            ### Download
            - **Linux**: `MediaDownloader` — 双击运行，内置 FFmpeg
            - **Windows**: `MediaDownloader.exe` — 双击运行，内置 FFmpeg

            ### Features
            - 抖音、快手、小红书、B站 多平台支持
            - 下载、批量下载、收藏夹、评论采集
            - DASH 音视频合并
            - 实时日志输出
            - 中英文国际化
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
