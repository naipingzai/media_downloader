<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MediaDownloader</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1e293b;border-radius:12px;padding:24px;width:100%;max-width:560px}
h1{color:#facc15;text-align:center;margin-bottom:4px;font-size:22px;font-weight:800}
.repo{color:#f59e0b;text-align:center;margin-bottom:16px;font-size:12px}
.step{color:#22d3ee;font-weight:700;margin:14px 0 6px;font-size:14px;padding-left:8px}
select,input{width:100%;padding:10px;border-radius:8px;border:2px solid #64748b;background:#fff;color:#000;font-size:14px;margin-bottom:10px;outline:none}
select:focus,input:focus{border-color:#22d3ee}
.btn-row{display:flex;gap:8px;margin-top:4px}
button{flex:1;padding:10px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
button:hover{opacity:.85}
.bg-go{background:#22c55e;color:#0f172a}
.bg-paste{background:#475569;color:#fff}
.bg-clear{background:#475569;color:#fff}
.bg-save{background:#3b82f6;color:#fff}
.cookie-status{background:#0f172a;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px;border:1px solid #334155}
.cs-ok{color:#22c55e}.cs-no{color:#ef4444}
#result{margin-top:14px;padding:12px;border-radius:8px;background:#0f172a;font-size:13px;white-space:pre-wrap;max-height:300px;overflow-y:auto;display:none;border:1px solid #334155}
.ok{border-left:4px solid #22c55e}.err{border-left:4px solid #ef4444}
footer{margin-top:14px;text-align:center;color:#475569;font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>MediaDownloader</h1>
<div class="repo">https://github.com/npznnz/MediaDownloader</div>
<div class="step">第一步: 选择平台</div>
<select id="plat" onchange="onPlat()"><option value="">-- 加载中 --</option></select>
<div id="s2" class="hidden">
  <div class="step">第二步: Cookie 管理</div>
  <div class="cookie-status" id="cs"><span class="cs-no">未设置</span></div>
  <input type="text" id="ct" placeholder="粘贴 Cookie 字符串">
  <div class="btn-row"><button class="bg-save" onclick="saveCookie()">保存 Cookie</button></div>
</div>
<div id="s3" class="hidden">
  <div class="step">第三步: 选择功能</div>
  <select id="func"><option value="">-- 请选择功能 --</option></select>
</div>
<div id="s5" class="hidden">
  <div class="step">第四步: 存储模式</div>
  <select id="sm" onchange="onStorage()">
    <option value="flat">直接存储</option>
    <option value="by_author">按作者分目录</option>
    <option value="by_date">按日期分目录</option>
    <option value="by_type">按类型分目录</option>
  </select>
</div>
<div id="s4" class="hidden">
  <div class="step">第五步: 输入链接</div>
  <input type="text" id="url" placeholder="粘贴链接">
</div>
<div class="btn-row hidden" id="btns">
  <button class="bg-go" onclick="doExec()">执行</button>
  <button class="bg-paste" onclick="navigator.clipboard?.readText().then(t=>document.getElementById('url').value=t)">粘贴</button>
  <button class="bg-clear" onclick="document.getElementById('url').value=''">清空</button>
</div>
<div id="result"></div>
<footer>MediaDownloader</footer>
</div>
<script>
let needLink=1,curPlat="",cookieHint="";

async function init(){
  try{
    const r=await fetch("/api/platforms");
    const platforms=await r.json();
    const sel=document.getElementById("plat");
    sel.innerHTML="<option value="">-- 请选择平台 --</option>";
    platforms.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;sel.appendChild(o)});
  }catch(e){document.getElementById("plat").innerHTML="<option>加载失败</option>";}
}

async function onPlat(){
  curPlat=document.getElementById("plat").value;
  document.getElementById("s2").classList.add("hidden");
  document.getElementById("s3").classList.add("hidden");
  document.getElementById("s4").classList.add("hidden");
  document.getElementById("btns").classList.add("hidden");
  if(!curPlat)return;
  const hr=await fetch("/api/cookie_hint/"+curPlat);const hd=await hr.json();cookieHint=hd.hint||"";
  if(cookieHint){
    document.getElementById("s2").classList.remove("hidden");
    await updateCookieStatus();
  }
  const fr=await fetch("/api/features/"+curPlat);const features=await fr.json();
  const sel=document.getElementById("func");sel.innerHTML="<option value="">-- 请选择功能 --</option>";
  features.forEach(f=>{const o=document.createElement("option");o.value=f.id;o.textContent=f.name;o.dataset.nl=f.need_url?"1":"0";sel.appendChild(o)});
  document.getElementById("s3").classList.remove("hidden");
    document.getElementById("s5").classList.remove("hidden");
  sel.onchange=()=>{const o=sel.options[sel.selectedIndex];needLink=o.dataset.nl==="1";document.getElementById("s4").classList.toggle("hidden",!needLink);document.getElementById("btns").classList.remove("hidden")};
}

async function updateCookieStatus(){
  const el=document.getElementById("cs");
  try{const r=await fetch("/api/cookie");const j=await r.json();const cookies=j.data?.cookies||{};const active=j.data?.active||"默认";
  const has=cookies[active]&&cookies[active][curPlat];
  el.innerHTML=has?"<span class="cs-ok">已设置</span>":"<span class="cs-no">未设置</span>";
  }catch(e){el.innerHTML="<span class="cs-no">无法获取状态</span>";}
}

async function saveCookie(){
  const text=document.getElementById("ct").value.trim();if(!text){alert("请输入 Cookie");return;}
  try{await fetch("/api/cookie",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({platform:curPlat,cookie:text})});
  document.getElementById("ct").value="";await updateCookieStatus();alert("已保存");}catch(e){alert("保存失败");}
}

async function doExec(){
  const fv=document.getElementById("func").value;if(!fv){alert("请选择功能");return;}
  if(needLink&&!document.getElementById("url").value.trim()){alert("请输入链接");return;}
  const res=document.getElementById("result");res.style.display="block";res.className="";res.textContent="执行中...";
  try{const r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({platform:curPlat,feature:fv,url:document.getElementById("url").value})});
  const j=await r.json();
  let text=j.message+"
";
  if(j.data?.log)text+=j.data.log.join("
");
  res.className=j.data?.success?"ok":"err";res.textContent=text;
  }catch(e){res.className="err";res.textContent="错误: "+e;}
}

async function onStorage(){
  await fetch("/api/storage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({platform:curPlat,cookie:document.getElementById("sm").value})});
}

init();
</script>
</body>
</html>
